# PGSS-YOLO11s — genuine PGSS integration into YOLO11s-seg.
#   GLSA  (SFAM)   : global-local spatial attention on the P3/P4/P5 backbone taps
#   AWFF  (AFFM)   : adaptive weighted fusion refinement after each neck concat
#   DEConv(DE-SCSH): detail-enhanced convolutions on the three head scales
# Backbone (layers 0-10) is kept identical to stock so pretrained yolo11s-seg
# backbone weights transfer via .load('yolo11s-seg.pt'). Stock Segment head is
# retained so Ultralytics' segmentation loss applies unchanged.

nc: 7
scales:
  s: [0.50, 0.50, 1024]

# ── Backbone (identical to stock yolo11-seg) ──
backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]# 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]# 4  (P3 tap, 256ch)
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]       # 6  (P4 tap, 256ch)
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]      # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]           # 10 (P5 tap, 512ch)

# ── PGSS head ──
head:
  # GLSA (SFAM) attention on the three backbone taps
  - [4,  1, GLSA, [256]]             # 11  P3 attended (256)
  - [6,  1, GLSA, [256]]             # 12  P4 attended (256)
  - [10, 1, GLSA, [512]]             # 13  P5 attended (512)

  # Top-down path with AWFF adaptive fusion
  - [13, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 12], 1, Concat, [1]]                    # 15  cat P4  (768)
  - [-1, 1, AWFF, [768]]                          # 16  adaptive-weighted fuse
  - [-1, 2, C3k2, [512, False]]                   # 17  (256)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 18
  - [[-1, 11], 1, Concat, [1]]                    # 19  cat P3  (512)
  - [-1, 1, AWFF, [512]]                          # 20
  - [-1, 2, C3k2, [256, False]]                   # 21  P3/8-small (128)

  # Bottom-up path with AWFF adaptive fusion
  - [-1, 1, Conv, [256, 3, 2]]                    # 22  (128)
  - [[-1, 17], 1, Concat, [1]]                    # 23  cat neck-P4 (384)
  - [-1, 1, AWFF, [384]]                          # 24
  - [-1, 2, C3k2, [512, False]]                   # 25  P4/16-medium (256)

  - [-1, 1, Conv, [512, 3, 2]]                    # 26  (256)
  - [[-1, 13], 1, Concat, [1]]                    # 27  cat P5 (768)
  - [-1, 1, AWFF, [768]]                          # 28
  - [-1, 2, C3k2, [1024, True]]                   # 29  P5/32-large (512)

  # DE-SCSH detail-enhanced convolutions on each head scale
  - [21, 1, DEConv, [128]]                        # 30  small
  - [25, 1, DEConv, [256]]                        # 31  medium
  - [29, 1, DEConv, [512]]                        # 32  large

  - [[30, 31, 32], 1, Segment, [nc, 32, 256]]     # 33  Segment(P3, P4, P5)
